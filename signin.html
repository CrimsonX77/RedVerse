<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — RedVerse</title>
<link rel="stylesheet" href="lyra.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
html, body { min-height: 100vh; }
body { display: flex; flex-direction: column; }

.signin-bg {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}

.signin-card {
  width: 100%;
  max-width: 440px;
  background: var(--lyra-stone);
  border: 1px solid var(--lyra-border);
  border-radius: var(--lyra-radius-xl);
  overflow: hidden;
  position: relative;
  box-shadow: var(--lyra-shadow-lg), var(--lyra-shadow-glow);
  animation: lyra-fadeSlideIn 0.5s var(--lyra-ease-snap) both;
}

.signin-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg,
    transparent,
    var(--lyra-blood) 10%,
    var(--lyra-crimson) 30%,
    var(--lyra-gold) 50%,
    var(--lyra-crimson) 70%,
    var(--lyra-blood) 90%,
    transparent
  );
}

.signin-logo-bar {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 36px 32px 24px;
  border-bottom: 1px solid var(--lyra-border);
  background: linear-gradient(180deg, rgba(220,20,60,0.05), transparent);
}

.signin-icon {
  width: 64px;
  height: 64px;
  border-radius: var(--lyra-radius-lg);
  background: linear-gradient(135deg, var(--lyra-blood), var(--lyra-crimson));
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 24px rgba(220,20,60,0.35);
  margin-bottom: 16px;
}

.signin-title {
  font-family: 'Cinzel', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--lyra-text-bright);
  letter-spacing: 2px;
  text-align: center;
  margin-bottom: 4px;
}

.signin-subtitle {
  font-size: 13px;
  color: var(--lyra-ghost);
  text-align: center;
}

.signin-body {
  padding: 28px 32px 32px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* Google button */
.btn-google {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  padding: 12px 20px;
  background: var(--lyra-obsidian);
  border: 1px solid var(--lyra-border);
  border-radius: var(--lyra-radius-md);
  color: var(--lyra-silver);
  font-family: 'Rajdhani', sans-serif;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: all var(--lyra-duration-med) var(--lyra-ease-smooth);
}

.btn-google:hover {
  border-color: var(--lyra-ghost);
  background: var(--lyra-slate);
  color: var(--lyra-text-bright);
}

.google-icon svg { flex-shrink: 0; }

/* Divider */
.lyra-or-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--lyra-ghost);
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  text-transform: uppercase;
  letter-spacing: 2px;
}

.lyra-or-divider::before,
.lyra-or-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--lyra-border);
}

/* Field groups */
.field-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field-label {
  font-family: 'Rajdhani', sans-serif;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--lyra-ash);
}

.field-wrap {
  position: relative;
}

.field-wrap .lyra-input {
  padding-right: 44px;
}

.field-eye {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--lyra-ghost);
  cursor: pointer;
  display: flex;
  align-items: center;
  padding: 4px;
  transition: color var(--lyra-duration-fast);
}

.field-eye:hover { color: var(--lyra-crimson); }

/* Row */
.signin-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
}

.lyra-checkbox-label {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--lyra-ash);
  cursor: pointer;
  font-size: 13px;
}

.lyra-checkbox-label input[type="checkbox"] {
  width: 15px;
  height: 15px;
  accent-color: var(--lyra-crimson);
  cursor: pointer;
}

.link-dim {
  color: var(--lyra-ghost);
  text-decoration: none;
  font-size: 12px;
  transition: color var(--lyra-duration-fast);
}

.link-dim:hover { color: var(--lyra-crimson); }

/* Error */
.error-bar {
  display: none;
  align-items: center;
  gap: 8px;
  background: rgba(255,45,64,0.1);
  border: 1px solid rgba(255,45,64,0.3);
  border-radius: var(--lyra-radius-md);
  padding: 10px 14px;
  font-size: 13px;
  color: var(--lyra-error);
}

.error-bar.visible { display: flex; }

/* Toggle link */
.signin-toggle {
  text-align: center;
  padding-top: 16px;
  border-top: 1px solid var(--lyra-border);
  font-size: 13px;
  color: var(--lyra-ghost);
}

.signin-toggle a {
  color: var(--lyra-crimson);
  text-decoration: none;
  font-weight: 600;
  margin-left: 6px;
  transition: color var(--lyra-duration-fast);
}

.signin-toggle a:hover { color: var(--lyra-rose); }

.terms-note {
  text-align: center;
  font-size: 11px;
  color: var(--lyra-dim);
  line-height: 1.6;
}

.terms-note a {
  color: var(--lyra-ghost);
  text-decoration: none;
  transition: color var(--lyra-duration-fast);
}

.terms-note a:hover { color: var(--lyra-crimson); }

/* Loading overlay */
.loading-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(6,6,10,0.85);
  backdrop-filter: blur(6px);
  z-index: 999;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

.loading-overlay.visible { display: flex; }

.lyra-spinner {
  width: 40px;
  height: 40px;
  border: 3px solid var(--lyra-border);
  border-top-color: var(--lyra-crimson);
  border-radius: 50%;
  animation: lyra-spin 0.8s linear infinite;
}

.loading-overlay p {
  font-family: 'Cinzel', serif;
  font-size: 13px;
  letter-spacing: 2px;
  color: var(--lyra-silver);
}
</style>
</head>
<body>
<div class="lyra-cathedral"></div>

<header class="lyra-header">
  <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit">
    <div style="width:32px;height:32px;border-radius:6px;background:linear-gradient(135deg,var(--lyra-blood),var(--lyra-crimson));display:flex;align-items:center;justify-content:center;box-shadow:0 0 10px rgba(220,20,60,0.3)">
      <span style="color:var(--lyra-gold);font-size:16px">♦</span>
    </div>
    <span class="lyra-logo">RED<span class="lyra-logo-accent">VERSE</span></span>
  </a>
</header>

<div class="signin-bg">
  <div class="signin-card">
    <div class="signin-logo-bar">
      <div class="signin-icon">
        <i class="material-icons" style="color:var(--lyra-gold);font-size:28px">lock</i>
      </div>
      <div class="signin-title" id="pageTitle">Welcome Back</div>
      <div class="signin-subtitle" id="pageSubtitle">Sign in to access your purchases and saved items</div>
    </div>

    <div class="signin-body">
      <!-- Error bar -->
      <div class="error-bar" id="errorMessage">
        <i class="material-icons" style="font-size:18px">error_outline</i>
        <span id="errorText">Something went wrong.</span>
      </div>

      <!-- Google -->
      <button class="btn-google" id="googleSignInBtn">
        <span class="google-icon">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
        </span>
        <span>Continue with Google</span>
      </button>

      <div class="lyra-or-divider"><span>or</span></div>

      <!-- Email -->
      <div class="field-group">
        <label class="field-label" for="email">Email address</label>
        <input class="lyra-input" type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="field-group">
        <label class="field-label" for="password">Password</label>
        <div class="field-wrap">
          <input class="lyra-input" type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button class="field-eye" id="togglePassword" type="button" aria-label="Toggle password">
            <i class="material-icons" id="eyeIcon" style="font-size:20px">visibility</i>
          </button>
        </div>
      </div>

      <div class="signin-row">
        <label class="lyra-checkbox-label">
          <input type="checkbox" id="rememberMe"> Remember me
        </label>
        <a href="#" class="link-dim">Forgot password?</a>
      </div>

      <button class="lyra-btn lyra-btn-primary" id="submitBtn" style="width:100%;justify-content:center;padding:14px;font-size:14px;letter-spacing:1px">
        <i class="material-icons" style="font-size:18px">login</i>
        <span id="submitLabel">SIGN IN</span>
      </button>

      <div class="signin-toggle">
        <span id="toggleText">Don't have an account?</span>
        <a href="#" id="toggleAuthMode">Sign up</a>
      </div>

      <div class="terms-note">
        By continuing, you agree to the
        <a href="#">Terms of Service</a> and
        <a href="#">Privacy Policy</a>.
      </div>
    </div>
  </div>
</div>

<footer class="lyra-footer">
  <span class="lyra-footer-brand">RedVerse — Sign In</span>
  <span class="lyra-mono">Secure authentication</span>
</footer>

<div class="loading-overlay" id="loadingOverlay">
  <div class="lyra-spinner"></div>
  <p>SIGNING IN…</p>
</div>

<script>
// Toggle password visibility
document.getElementById('togglePassword').addEventListener('click', () => {
  const pw = document.getElementById('password');
  const icon = document.getElementById('eyeIcon');
  if (pw.type === 'password') {
    pw.type = 'text';
    icon.textContent = 'visibility_off';
  } else {
    pw.type = 'password';
    icon.textContent = 'visibility';
  }
});

// Toggle sign-in / sign-up mode
let isSignUp = false;
document.getElementById('toggleAuthMode').addEventListener('click', (e) => {
  e.preventDefault();
  isSignUp = !isSignUp;
  document.getElementById('pageTitle').textContent       = isSignUp ? 'Create Account'   : 'Welcome Back';
  document.getElementById('pageSubtitle').textContent    = isSignUp ? 'Join the Redverse' : 'Sign in to access your purchases and saved items';
  document.getElementById('submitLabel').textContent     = isSignUp ? 'SIGN UP'           : 'SIGN IN';
  document.getElementById('toggleText').textContent      = isSignUp ? 'Already have an account?' : "Don't have an account?";
  document.getElementById('toggleAuthMode').textContent  = isSignUp ? 'Sign in' : 'Sign up';
});

// Load the actual auth module if present
try {
  const s = document.createElement('script');
  s.type = 'module';
  s.src = 'js/auth.js';
  document.body.appendChild(s);
} catch(e) {}
</script>
</body>
</html>
