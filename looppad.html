<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ Loop Pad — RedForest Labs</title>
<link rel="stylesheet" href="lyra.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
html,body{height:100vh;overflow:hidden}body{display:flex;flex-direction:column}
.pad-layout{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:20px;gap:16px}
.pad-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;flex:1;overflow-y:auto;align-content:start}
.pad-key{aspect-ratio:1;border-radius:var(--lyra-radius-md);border:1px solid var(--lyra-border);background:var(--lyra-stone);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s;position:relative;overflow:hidden;user-select:none}
.pad-key:hover{border-color:var(--lyra-crimson);background:var(--lyra-blush)}
.pad-key.loaded{border-color:var(--lyra-brass)}
.pad-key.playing{border-color:var(--lyra-crimson);background:rgba(220,20,60,0.15);box-shadow:0 0 20px rgba(220,20,60,0.3)}
.pad-key.playing::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at center,rgba(220,20,60,0.1),transparent 70%);animation:padPulse 0.8s ease infinite alternate}
@keyframes padPulse{from{opacity:0.3}to{opacity:1}}
.pad-letter{font-family:'Cinzel',serif;font-size:24px;font-weight:700;color:var(--lyra-silver);transition:color 0.15s}
.pad-key.playing .pad-letter{color:var(--lyra-crimson);text-shadow:0 0 12px rgba(220,20,60,0.5)}
.pad-key.loaded .pad-letter{color:var(--lyra-gold)}
.pad-file{font-size:8px;color:var(--lyra-ghost);margin-top:4px;max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.pad-upload{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:3px;background:rgba(0,0,0,0.4);border:1px solid var(--lyra-border);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.15s;font-size:12px;color:var(--lyra-ash)}
.pad-key:hover .pad-upload{opacity:1}
.pad-upload:hover{background:var(--lyra-crimson);color:#fff;border-color:var(--lyra-crimson)}
.pad-controls{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--lyra-border)}
.vol-wrap{display:flex;align-items:center;gap:8px;flex:1;max-width:300px}
.vol-wrap label{font-size:11px;color:var(--lyra-ash);font-weight:600;white-space:nowrap}
.vol-val{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--lyra-crimson);width:36px;text-align:center}
</style>
</head>
<body>
<div class="lyra-cathedral"></div>
<header class="lyra-header">
  <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit">
    <div style="width:32px;height:32px;border-radius:6px;background:linear-gradient(135deg,var(--lyra-blood),var(--lyra-crimson));display:flex;align-items:center;justify-content:center;box-shadow:0 0 10px rgba(220,20,60,0.3)"><span style="color:var(--lyra-gold);font-size:16px">♦</span></div>
    <span class="lyra-logo">DJ <span class="lyra-logo-accent">LOOP PAD</span></span>
  </a>
  <div style="display:flex;gap:8px">
    <div class="lyra-status-pill"><div class="lyra-dot lyra-dot-pulse" id="dotStatus"></div><span id="lblStatus">…</span></div>
  </div>
</header>

<div class="pad-layout">
  <div class="pad-grid" id="padGrid"></div>
  <div class="pad-controls">
    <button class="lyra-btn lyra-btn-danger" id="stopAllBtn"><i class="material-icons" style="font-size:16px">stop</i> Stop All</button>
    <div class="vol-wrap">
      <label>Volume</label>
      <input class="lyra-range" type="range" id="volSlider" min="0" max="100" value="100" style="flex:1">
      <span class="vol-val" id="volVal">100%</span>
    </div>
    <span class="lyra-mono lyra-text-dim" style="font-size:10px;margin-left:auto" id="padInfo">Press a key or click a pad</span>
  </div>
</div>

<footer class="lyra-footer">
  <span class="lyra-footer-brand">DJ Loop Pad · RedForest Labs</span>
  <span class="lyra-mono" id="footerInfo">—</span>
</footer>

<input type="file" id="fileInput" accept=".wav,.mp3,.ogg,.flac" style="display:none">

<script>
const API='http://127.0.0.1:8912';
const $=id=>document.getElementById(id);
let activeKey=null;
const padState={};

// Build grid
const grid=$('padGrid');
for(let i=0;i<26;i++){
  const key=String.fromCharCode(65+i);
  padState[key]={loaded:false,playing:false,file:''};
  const el=document.createElement('div');
  el.className='pad-key';el.dataset.key=key;
  el.innerHTML=`<div class="pad-letter">${key}</div><div class="pad-file" id="file${key}"></div><div class="pad-upload" title="Upload sound">+</div>`;
  el.querySelector('.pad-upload').addEventListener('click',e=>{e.stopPropagation();activeKey=key;$('fileInput').click()});
  el.addEventListener('click',()=>togglePad(key));
  grid.appendChild(el);
}

// File upload
$('fileInput').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f||!activeKey)return;
  const fd=new FormData();fd.append('key',activeKey);fd.append('file',f);
  try{
    const r=await fetch(`${API}/api/assign`,{method:'POST',body:fd});
    const d=await r.json();
    if(r.ok&&d.key){
      padState[d.key].loaded=true;padState[d.key].file=f.name;
      updatePadUI(d.key);
      $('padInfo').textContent=`${f.name} → ${d.key}`;
    }else if(d.error){
      $('padInfo').textContent=`Upload failed: ${d.error}`;
    }
  }catch(e){console.error(e);$('padInfo').textContent='Upload failed: server offline'}
  $('fileInput').value='';
});

// Toggle
async function togglePad(key){
  try{
    const r=await fetch(`${API}/api/toggle`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});
    const d=await r.json();
    if(d.state){
      padState[key].playing=d.state==='playing';
      updatePadUI(key);
      $('padInfo').textContent=`${key}: ${d.state}`;
    }else if(d.error){$('padInfo').textContent=d.error}
  }catch(e){$('padInfo').textContent='Server offline'}
}

// Keyboard
document.addEventListener('keydown',e=>{
  const k=e.key.toUpperCase();
  if(k.length===1&&k>='A'&&k<='Z')togglePad(k);
});

// Stop all
$('stopAllBtn').addEventListener('click',async()=>{
  try{await fetch(`${API}/api/stop`,{method:'POST'})}catch(e){}
  Object.keys(padState).forEach(k=>{padState[k].playing=false;updatePadUI(k)});
  $('padInfo').textContent='All stopped';
});

// Volume
$('volSlider').addEventListener('input',async e=>{
  const v=e.target.value;$('volVal').textContent=v+'%';
  try{await fetch(`${API}/api/volume`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({volume:v/100})})}catch(e){}
});

function updatePadUI(key){
  const el=grid.querySelector(`[data-key="${key}"]`);if(!el)return;
  el.classList.toggle('loaded',padState[key].loaded);
  el.classList.toggle('playing',padState[key].playing);
  $(`file${key}`).textContent=padState[key].file||'';
}

// Status poll
async function poll(){
  try{
    const r=await fetch(`${API}/api/status`);const d=await r.json();
    $('dotStatus').className='lyra-dot lyra-dot-ok';$('lblStatus').textContent='Online';
    d.loaded.forEach(k=>{padState[k].loaded=true;updatePadUI(k)});
    Object.keys(padState).forEach(k=>{padState[k].playing=d.playing.includes(k);updatePadUI(k)});
    $('footerInfo').textContent=`${d.loaded.length} sounds loaded · Vol: ${Math.round(d.volume*100)}%`;
  }catch(e){$('dotStatus').className='lyra-dot lyra-dot-error';$('lblStatus').textContent='Offline'}
}
poll();setInterval(poll,5000);
</script>
</body>
</html>
