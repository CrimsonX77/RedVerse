<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Cutter — RedForest Labs</title>
<link rel="stylesheet" href="lyra.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
html,body{height:100vh;overflow:hidden}body{display:flex;flex-direction:column}
.cutter-layout{flex:1;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:24px}
.cutter-card{width:100%;max-width:560px;background:var(--lyra-stone);border:1px solid var(--lyra-border);border-radius:var(--lyra-radius-lg);overflow:hidden;position:relative}
.cutter-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--lyra-crimson) 20%,var(--lyra-gold) 50%,var(--lyra-crimson) 80%,transparent);opacity:0.5}
.cutter-body{padding:24px;display:flex;flex-direction:column;gap:20px}
.drop-zone{border:2px dashed var(--lyra-border);border-radius:var(--lyra-radius-lg);padding:48px 20px;text-align:center;color:var(--lyra-ghost);cursor:pointer;transition:all 0.2s;background:var(--lyra-obsidian)}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--lyra-crimson);background:var(--lyra-blush);color:var(--lyra-silver)}
.drop-zone .material-icons{font-size:56px;opacity:0.15;display:block;margin-bottom:14px;color:var(--lyra-crimson)}
.file-info{background:var(--lyra-obsidian);border:1px solid var(--lyra-border);border-radius:var(--lyra-radius-md);padding:14px;display:none}
.file-info.visible{display:flex;gap:16px;align-items:center}
.file-info-icon{width:48px;height:48px;border-radius:var(--lyra-radius-md);background:linear-gradient(135deg,var(--lyra-blood),var(--lyra-crimson));display:flex;align-items:center;justify-content:center;flex-shrink:0}
.file-info-icon .material-icons{color:var(--lyra-gold);font-size:24px}
.file-details{flex:1}
.file-name{font-weight:700;font-size:14px;color:var(--lyra-text-bright)}
.file-meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--lyra-ash);margin-top:2px}
.parts-row{display:flex;align-items:center;gap:12px}
.parts-row label{font-weight:600;font-size:13px;color:var(--lyra-silver);white-space:nowrap}
.parts-input{width:80px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700}
.parts-visual{display:flex;gap:3px;flex-wrap:wrap;min-height:24px;align-items:center}
.part-block{height:20px;border-radius:2px;background:linear-gradient(135deg,var(--lyra-blood),var(--lyra-crimson));flex:1;min-width:8px;max-width:40px;transition:all 0.2s;opacity:0.6}
.part-block:hover{opacity:1;transform:scaleY(1.3)}
.split-progress{height:4px;background:var(--lyra-iron);border-radius:2px;overflow:hidden;display:none}
.split-progress.active{display:block}
.split-progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--lyra-blood),var(--lyra-crimson),var(--lyra-ember));transition:width 0.5s}
</style>
</head>
<body>
<div class="lyra-cathedral"></div>
<header class="lyra-header">
  <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit">
    <div style="width:32px;height:32px;border-radius:6px;background:linear-gradient(135deg,var(--lyra-blood),var(--lyra-crimson));display:flex;align-items:center;justify-content:center;box-shadow:0 0 10px rgba(220,20,60,0.3)"><span style="color:var(--lyra-gold);font-size:16px">♦</span></div>
    <span class="lyra-logo">AUDIO <span class="lyra-logo-accent">CUTTER</span></span>
  </a>
  <div class="lyra-status-pill"><div class="lyra-dot lyra-dot-pulse" id="dotStatus"></div><span id="lblStatus">…</span></div>
</header>

<div class="cutter-layout">
  <div class="cutter-card">
    <div class="cutter-body">
      <div class="drop-zone" id="dropZone">
        <i class="material-icons">content_cut</i>
        <div style="font-family:'Cinzel',serif;font-size:16px;letter-spacing:2px;color:var(--lyra-ash)">Drop audio file</div>
        <div style="font-size:12px;margin-top:6px;color:var(--lyra-dim)">MP3 · WAV · FLAC · OGG · AAC</div>
      </video>
      </div>
      <input type="file" id="fileInput" accept=".mp3,.wav,.flac,.aac,.ogg" style="display:none">

      <!-- File info -->
      <div class="file-info" id="fileInfo">
        <div class="file-info-icon"><i class="material-icons">audiotrack</i></div>
        <div class="file-details">
          <div class="file-name" id="fileName">—</div>
          <div class="file-meta" id="fileMeta">—</div>
        </div>
        <button class="lyra-btn lyra-btn-ghost" id="clearBtn" style="padding:4px 8px"><i class="material-icons" style="font-size:16px">close</i></button>
      </div>

      <!-- Parts selector -->
      <div>
        <div class="lyra-section-title">Split Into</div>
        <div class="parts-row">
          <label>Parts:</label>
          <input class="lyra-input parts-input" type="number" id="partsInput" value="2" min="1" max="100">
          <input class="lyra-range" type="range" id="partsSlider" min="1" max="20" value="2" style="flex:1">
        </div>
        <div class="parts-visual" id="partsVisual"></div>
      </div>

      <!-- Progress -->
      <div class="split-progress" id="progress"><div class="split-progress-fill" id="progressFill"></div></div>

      <!-- Split button -->
      <button class="lyra-btn lyra-btn-primary" id="splitBtn" disabled style="width:100%;justify-content:center;padding:14px">
        <i class="material-icons" style="font-size:18px">content_cut</i> SPLIT & DOWNLOAD
      </button>

      <div class="lyra-mono lyra-text-dim" style="font-size:11px;text-align:center" id="statusText">Upload a file to begin</div>
    </div>
  </div>
</div>

<footer class="lyra-footer">
  <span class="lyra-footer-brand">Audio Cutter · RedForest Labs</span>
  <span class="lyra-mono" id="footerInfo">—</span>
</footer>

<script>
const API='http://127.0.0.1:8914';
const $=id=>document.getElementById(id);
let currentFile=null;

// Drop zone
const dz=$('dropZone'),fi=$('fileInput');
dz.addEventListener('click',()=>fi.click());
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover')});
dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('dragover');if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0])});
fi.addEventListener('change',()=>{if(fi.files[0])loadFile(fi.files[0])});

async function loadFile(file){
  currentFile=file;
  $('fileName').textContent=file.name;
  $('fileMeta').textContent=`${(file.size/1048576).toFixed(2)} MB`;
  $('fileInfo').classList.add('visible');
  dz.style.display='none';
  $('splitBtn').disabled=false;
  $('statusText').textContent='Ready to split';

  // Get audio info from server
  const fd=new FormData();fd.append('file',file);
  try{
    const r=await fetch(`${API}/api/info`,{method:'POST',body:fd});
    const d=await r.json();
    if(d.duration_s)$('fileMeta').textContent=`${d.duration_s}s · ${d.channels}ch · ${d.sample_rate}Hz · ${d.size_mb}MB`;
  }catch(e){}
}

$('clearBtn').addEventListener('click',()=>{
  currentFile=null;
  $('fileInfo').classList.remove('visible');
  dz.style.display='';
  $('splitBtn').disabled=true;
  $('statusText').textContent='Upload a file to begin';
  fi.value='';
});

// Parts sync
$('partsInput').addEventListener('input',e=>{$('partsSlider').value=e.target.value;updateVisual()});
$('partsSlider').addEventListener('input',e=>{$('partsInput').value=e.target.value;updateVisual()});

function updateVisual(){
  const n=parseInt($('partsInput').value)||2;
  const v=$('partsVisual');v.innerHTML='';
  for(let i=0;i<Math.min(n,50);i++){const b=document.createElement('div');b.className='part-block';b.style.animationDelay=(i*0.03)+'s';v.appendChild(b)}
  if(n>50)v.innerHTML+='<span class="lyra-mono lyra-text-dim" style="font-size:10px">+'+( n-50)+' more</span>';
}
updateVisual();

// Split
$('splitBtn').addEventListener('click',async()=>{
  if(!currentFile)return;
  const parts=parseInt($('partsInput').value);
  if(parts<1||parts>100){$('statusText').textContent='Parts must be 1-100';return}

  $('splitBtn').disabled=true;
  $('progress').classList.add('active');
  $('progressFill').style.width='30%';
  $('statusText').textContent='Splitting…';

  const fd=new FormData();
  fd.append('file',currentFile);
  fd.append('parts',parts);

  try{
    const r=await fetch(`${API}/api/split`,{method:'POST',body:fd});
    $('progressFill').style.width='100%';
    const blob=await r.blob();
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=currentFile.name.replace(/\.[^.]+$/,'')+'_split.zip';a.click();
    $('statusText').textContent=`Done — split into ${parts} parts`;
  }catch(e){
    $('statusText').textContent='Error: '+e.message;
  }

  $('splitBtn').disabled=false;
  setTimeout(()=>{$('progress').classList.remove('active');$('progressFill').style.width='0%'},1000);
});

// Status
async function poll(){try{await fetch(`${API}/api/status`);$('dotStatus').className='lyra-dot lyra-dot-ok';$('lblStatus').textContent='Online'}catch(e){$('dotStatus').className='lyra-dot lyra-dot-error';$('lblStatus').textContent='Offline'}}
poll();setInterval(poll,10000);
</script>
</body>
</html>
