<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedVerse • Under Construction</title>
    <link rel="stylesheet" href="lyra.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&amp;family=Crimson+Pro:wght@400;600&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
        
        :root {
            --lyra-void: #06060a;
            --lyra-crimson: #dc143c;
            --lyra-gold: #ffd700;
            --lyra-blood: #8b0000;
        }
        
        body {
            margin: 0;
            padding: 0;
            background: var(--lyra-void);
            color: #e0e0e0;
            font-family: 'Crimson Pro', serif;
            overflow-x: hidden;
        }
        
        .coming-soon-hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
        }
        
        .hero-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.85) contrast(1.1);
            z-index: 1;
        }
        
        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(6,6,10,0.65) 0%,
                rgba(6,6,10,0.35) 40%,
                rgba(6,6,10,0.75) 70%,
                rgba(6,6,10,0.95) 100%
            );
            z-index: 2;
        }
        
        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 820px;
            padding: 40px 24px;
        }
        
        .redverse-sigil {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, var(--lyra-blood), var(--lyra-crimson));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(220,20,60,0.5),
                        inset 0 0 20px rgba(255,215,0,0.3);
        }
        
        .redverse-sigil .material-icons {
            font-size: 36px;
            color: var(--lyra-gold);
        }
        
        .main-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.8rem, 8vw, 5.2rem);
            font-weight: 900;
            letter-spacing: 6px;
            color: #fff;
            text-shadow: 0 0 60px rgba(220,20,60,0.6);
            margin-bottom: 12px;
            line-height: 1.05;
        }
        
        .main-title .accent {
            background: linear-gradient(90deg, #ffd700, #ffaa00, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            font-size: 1.35rem;
            color: #c9a9a9;
            margin-bottom: 32px;
            font-style: italic;
            max-width: 520px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .status-bar {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(220,20,60,0.1);
            border: 1px solid rgba(220,20,60,0.4);
            padding: 8px 24px;
            border-radius: 9999px;
            margin-bottom: 40px;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            background: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 12px #ffd700;
            animation: pulse 2s infinite;
        }
        
        .status-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            letter-spacing: 2px;
            color: #ffd700;
            text-transform: uppercase;
        }
        
        .cta-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .lyra-btn {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            border: 2px solid;
        }
        
        .lyra-btn-primary {
            background: linear-gradient(135deg, #dc143c, #8b0000);
            color: white;
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(220,20,60,0.4);
        }
        
        .lyra-btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(220,20,60,0.6);
        }
        
        .lyra-btn-ghost {
            background: transparent;
            color: #ffd700;
            border-color: #ffd700;
        }
        
        .lyra-btn-ghost:hover {
            background: rgba(255,215,0,0.1);
        }
        
        .footer {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: #666;
            letter-spacing: 1.5px;
            text-align: center;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        .construction-particles {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255,215,0,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(220,20,60,0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 3;
        }
    </style>
</head>
<body>

    <div class="coming-soon-hero">
        <!-- Hero Background Image -->
        <img src="assets/redverse-under-construction-hero.jpg" 
             alt="RedVerse Under Construction - The Forge" 
             class="hero-image">
        
        <!-- Gradient Overlay -->
        <div class="hero-overlay"></div>
        
        <!-- Subtle animated particles -->
        <div class="construction-particles"></div>
        
        <!-- Main Content -->
        <div class="hero-content">
            
            <!-- Sigil -->
            <div class="redverse-sigil">
                <i class="material-icons">build</i>
            </div>
            
            <!-- Title -->
            <h1 class="main-title">
                THE <span class="accent">FORGE</span><br>
                IS AWAKENING
            </h1>
            
            <p class="subtitle">
                RedVerse is currently being forged in the cathedral.<br>
                The tools are almost ready.
            </p>
            
            <!-- Status -->
            <div class="status-bar">
                <div class="status-dot"></div>
                <span class="status-text">Soft Launch • May 2026</span>
            </div>
            
            <!-- CTAs -->
            <div class="cta-buttons">
                <a href="tools.html" class="lyra-btn lyra-btn-primary">
                    <i class="material-icons">visibility</i>
                    <span>Preview The Forge</span>
                </a>
                
                <a href="https://crimsondragonx7.gumroad.com" 
                   target="_blank" 
                   class="lyra-btn lyra-btn-ghost">
                    <i class="material-icons">shopping_cart</i>
                    <span>Shop on Gumroad</span>
                </a>
            </div>
            
        </div>
        
        <!-- Footer -->
        <div class="footer">
            REDVERSE • FORGED IN THE CATHEDRAL • PLEASE COME BACK SOON
        </div>
        
    </div>

    <script>
        // Optional: subtle floating particles on the construction site
        function createFloatingParticles() {
            const container = document.querySelector('.construction-particles');
            for (let i = 0; i < 18; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'absolute';
                particle.style.width = '3px';
                particle.style.height = '3px';
                particle.style.background = Math.random() > 0.5 ? '#ffd700' : '#dc143c';
                particle.style.borderRadius = '50%';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.opacity = Math.random() * 0.6 + 0.3;
                particle.style.pointerEvents = 'none';
                
                const duration = Math.random() * 25 + 18;
                particle.style.transition = `all ${duration}s linear`;
                
                container.appendChild(particle);
                
                setTimeout(() => {
                    particle.style.transform = `translateY(-${Math.random() * 300 + 200}px)`;
                    particle.style.opacity = '0';
                }, 50);
                
                setTimeout(() => {
                    particle.remove();
                }, duration * 1000);
            }
        }
        
        // Run particles every 4 seconds
        setInterval(createFloatingParticles, 4000);
        createFloatingParticles();
        
        // Easter egg: click the sigil for extra sparkles
        document.querySelector('.redverse-sigil').addEventListener('click', () => {
            const sigil = document.querySelector('.redverse-sigil');
            sigil.style.transform = 'scale(1.3)';
            setTimeout(() => {
                sigil.style.transform = 'scale(1)';
            }, 200);
            
            for (let i = 0; i < 12; i++) {
                setTimeout(() => {
                    const spark = document.createElement('div');
                    spark.style.position = 'absolute';
                    spark.style.left = '50%';
                    spark.style.top = '50%';
                    spark.style.width = '4px';
                    spark.style.height = '4px';
                    spark.style.background = '#ffd700';
                    spark.style.borderRadius = '50%';
                    spark.style.pointerEvents = 'none';
                    spark.style.zIndex = '100';
                    document.querySelector('.hero-content').appendChild(spark);
                    
                    const angle = (i / 12) * 360;
                    const distance = 60 + Math.random() * 40;
                    
                    spark.animate([
                        { 
                            transform: `translate(-50%, -50%)`,
                            opacity: 1 
                        },
                        { 
                            transform: `translate(-50%, -50%) translate(${Math.cos(angle * Math.PI / 180) * distance}px, ${Math.sin(angle * Math.PI / 180) * distance}px)`,
                            opacity: 0 
                        }
                    ], {
                        duration: 600,
                        easing: 'ease-out'
                    }).onfinish = () => spark.remove();
                }, i * 20);
            }
        });
        
        console.log('%c[RedVerse] Coming Soon page loaded. The Forge awaits.', 'color:#ffd700');
    </script>
</body>
</html>
